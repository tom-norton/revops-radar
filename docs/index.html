<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RevOps Radar</title>
<style>
  :root{
    --teal:#117A82; --ink:#1B2224; --sub:#5D6B6E; --bg:#F7F9F9;
    --card:#FFFFFF; --line:#DCE4E4; --good:#1E874B; --warn:#B8770B; --mut:#8A9699;
    --gap:#A8412C;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#E8EEEE; --sub:#93A3A5; --bg:#101617; --card:#182022;
           --line:#263235; --teal:#2FA6AE; --good:#3FBE72; --warn:#E0A93B; --mut:#5D6B6E;
           --gap:#E07A62; }
  }
  *{box-sizing:border-box; margin:0}
  body{background:var(--bg); color:var(--ink);
       font:15px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       max-width:720px; margin:0 auto; padding:22px 16px 70px}
  a{color:var(--teal)}
  h1{font-size:25px; letter-spacing:-.02em; font-weight:800}
  h1 span{color:var(--teal)}
  .meta{color:var(--sub); font-size:12.5px; margin:5px 0 20px}
  h2{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--sub);
     margin:26px 0 10px; font-weight:700}

  .job{background:var(--card); border:1px solid var(--line); border-radius:11px;
       padding:14px; margin-bottom:11px}
  .row1{display:flex; gap:12px; align-items:flex-start}
  .score{font-weight:700; font-size:18px; min-width:46px; height:44px;
         display:flex; align-items:center; justify-content:center; border-radius:9px;
         background:var(--teal); color:#fff; flex-shrink:0}
  .score.s-apply{background:var(--good)} .score.s-border{background:var(--warn)}
  /* Pay read off the posting reads as solid; pay taken from a feed is outlined, because
     the difference between the two is exactly what wants checking before applying. */
  .tag.pay{background:var(--teal); color:#fff; border-color:var(--teal); font-weight:600}
  .tag.pay.est{background:transparent; color:var(--teal); border-style:dashed;
               font-weight:500}
  /* Deliberately not on the good/warn scale: an unscored row is off the scale, not at the
     bottom of it. Muted so it reads as "nothing here yet" rather than as a low score. */
  .score.s-none{background:transparent; border:1px dashed var(--line); color:var(--sub);
                font-size:22px; font-weight:400}
  /* The score and, under it, the two halves it is made of. Stacked rather than side by
     side because the column is 58px wide on a phone and "Shot 6.2 · Want 8.5" on one line
     wraps into nonsense there. */
  .scorecol{display:flex; flex-direction:column; align-items:center; gap:3px;
            flex-shrink:0; min-width:58px}
  .sw{font-size:10.5px; line-height:1.35; color:var(--sub); text-align:center}
  .sw b{color:var(--ink); font-weight:650}
  .sw .lo{color:var(--warn)}
  .hd{flex:1; min-width:0}
  .title{font-weight:650; font-size:15.5px; line-height:1.35}
  .company{color:var(--sub); font-size:13px; margin-top:1px}
  .verdict{font-size:13.5px; margin:10px 0 0; color:var(--ink)}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
  /* Wrapping, not nowrap. A pill that cannot wrap makes the CARD wider than the screen:
     at 375px the page scrolled sideways on 104 of 137 cards, and the text that pushed it
     out was cut off anyway. Short facts are what belong in a pill now -- anything with a
     sentence in it is a watch-out, below. */
  .tag{font-size:11px; padding:3px 8px; border-radius:20px; border:1px solid var(--line);
       color:var(--sub); white-space:normal; overflow-wrap:anywhere}
  .tag.spon{border-color:var(--good); color:var(--good)}
  .tag.nospon{border-color:var(--warn); color:var(--warn)}
  .tag.flag{border-color:var(--warn); color:var(--warn)}
  /* A hard gap is not a risk to weigh, it is a stated requirement you do not meet -- the
     thing a recruiter stops on. Its own colour so it does not read as one more caution. */
  .tag.gap{border-color:var(--gap); color:var(--gap); font-weight:650}
  /* One line of text rather than six flex cells: the strip is a reference, read once when
     a score looks surprising, and it was taking three lines on a phone. */
  .dims{margin-top:11px; font-size:11.5px; color:var(--sub); line-height:1.6}
  .dims b{color:var(--ink); font-weight:650}
  /* The scorer's own risk notes. These were pills, cut at 70 characters and overflowing
     the card; they are sentences, so they are set as sentences. */
  .watch{margin-top:10px; font-size:12.5px; color:var(--sub)}
  .watch .wh{font-size:11px; text-transform:uppercase; letter-spacing:.06em;
             color:var(--warn); font-weight:700}
  .watch ul{margin:3px 0 0; padding-left:17px}
  .watch li{margin:2px 0}
  /* Found since the last time this page was opened. Three scans a day means "what is new"
     is the question every visit starts with. */
  .newdot{display:inline-block; width:7px; height:7px; border-radius:50%;
          background:var(--teal); margin-right:6px; vertical-align:middle}
  .when{color:var(--mut); font-size:11.5px; margin-left:auto}
  .foot{display:flex; justify-content:space-between; align-items:center;
        margin-top:11px; font-size:12px}
  .foot a{font-weight:650; text-decoration:none}
  .foot .src{color:var(--mut)}
  .actions{display:flex; gap:8px; margin-top:11px}
  .actions button{font:600 11.5px -apple-system,"Segoe UI",Roboto,sans-serif;
        padding:6px 11px; border-radius:20px; border:1px solid var(--line);
        background:transparent; color:var(--sub); cursor:pointer}
  .actions button:hover{border-color:var(--teal); color:var(--teal)}
  .actions button[data-act="applied"]:hover{border-color:var(--good); color:var(--good)}
  .actions button[data-act="copy"]{border-color:var(--teal); color:var(--teal)}
  .actions button[data-act="copy"]:hover{background:var(--teal); color:#fff}
  .tag.fillable{border-color:var(--good); color:var(--good); font-weight:650}
  .tag.board{color:var(--mut)}
  .actions .status{font-size:11px; padding:3px 8px; border-radius:20px; color:var(--sub)}
  .job.reviewed{opacity:.6}
  .why{margin-top:11px; padding:11px; border:1px dashed var(--line); border-radius:9px}
  .why .wq{font-size:12px; color:var(--sub); margin-bottom:8px}
  .why .chips{margin-bottom:8px}
  .why input{width:100%; font:13px -apple-system,"Segoe UI",Roboto,sans-serif;
        padding:6px 9px; border:1px solid var(--line); border-radius:7px;
        background:var(--bg); color:var(--ink)}
  .why .actions{margin-top:8px}
  .why .actions button[data-save]{border-color:var(--teal); color:var(--teal)}
  .whynote{font-size:11.5px; color:var(--sub); margin-top:6px}
  details.borderline>summary,details.reviewed>summary,details.excluded>summary{
        cursor:pointer; color:var(--sub); font-size:13px; list-style:none; user-select:none}
  details.borderline>summary::-webkit-details-marker,
  details.reviewed>summary::-webkit-details-marker,
  details.excluded>summary::-webkit-details-marker{display:none}
  details.borderline>summary::before,details.reviewed>summary::before,
  details.excluded>summary::before{content:"\25B8 "; color:var(--mut)}
  details.borderline[open]>summary::before,details.reviewed[open]>summary::before,
  details.excluded[open]>summary::before{content:"\25BE "}
  details.excluded{margin-top:10px}
  .tag.cap{border-color:var(--mut); color:var(--mut)}
  /* Market by tier: the goal reads loudest, the last resort quietest. */
  .tag.market.t1{border-color:var(--good); color:var(--good); font-weight:650}
  .tag.market.t2{border-color:var(--teal); color:var(--teal)}
  .tag.market.t3{color:var(--mut)}
  .tag.market.t4{border-style:dashed; color:var(--mut)}
  .tag.market.t9{border-style:dashed; color:var(--warn)}
  .tag.conflict{border-color:var(--warn); color:var(--warn); font-weight:650}
  .tag.transfer{border-color:var(--teal); color:var(--teal)}
  .subhead{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;
        color:var(--mut); margin:16px 0 8px; font-weight:700}
  .drop{border-bottom:1px solid var(--line); padding:8px 0; font-size:12.5px}
  .drop:last-child{border-bottom:none}
  .drop .dt{color:var(--ink)}
  .drop .dr{color:var(--sub); font-size:11.5px; margin-top:2px}
  .empty{color:var(--sub); font-size:14px; padding:14px 0}
  .note{color:var(--mut); font-size:11.5px; margin:-14px 0 20px}
  /* The filter bar. Sticky because the list is 500 rows deep and the decision "show me
     the Dutch ones" is one he makes halfway down it as often as at the top. */
  .filters{position:sticky; top:0; z-index:5; background:var(--bg);
           padding:8px 0 9px; margin:0 0 6px; border-bottom:1px solid var(--line)}
  .chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  .chips + .chips{margin-top:6px}
  .chips .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
              color:var(--mut); font-weight:700; margin-right:2px; min-width:44px}
  .chip{font:600 11.5px -apple-system,"Segoe UI",Roboto,sans-serif; padding:4px 10px;
        border-radius:20px; border:1px solid var(--line); background:transparent;
        color:var(--sub); cursor:pointer; white-space:nowrap}
  .chip .n{font-weight:400; color:var(--mut); margin-left:4px}
  .chip[aria-pressed="true"]{border-color:var(--teal); color:#fff; background:var(--teal)}
  .chip[aria-pressed="true"] .n{color:#fff; opacity:.75}
  .chip:disabled{opacity:.45; cursor:default}
  .sources{margin-top:34px; border-top:1px solid var(--line); padding-top:14px;
        font-size:11.5px; color:var(--mut)}
  .sources div{margin:3px 0}
  .toast{position:fixed; left:50%; bottom:18px; transform:translateX(-50%); max-width:calc(100% - 32px);
        padding:8px 14px; border-radius:20px; font-size:12.5px; background:var(--card);
        border:1px solid var(--line); color:var(--sub); opacity:0; transition:opacity .2s;
        pointer-events:none}
  .toast.on{opacity:1} .toast.ok{border-color:var(--good); color:var(--good)}
  .toast.bad{border-color:var(--warn); color:var(--warn)}
  .sources .ok{color:var(--sub)} .sources .bad{color:var(--warn)}
</style>
</head>
<body>
  <h1><span>RevOps</span> Radar</h1>
  <div class="meta" id="meta">Loading…</div>
  <div class="note" id="synclabel">Hide / Mark applied are saved in this browser only — they won't follow you to another device.</div>

  <div class="filters" id="filters">
    <div class="chips" id="marketchips"><span class="lbl">Market</span></div>
    <div class="chips" id="trackchips"><span class="lbl">Track</span></div>
  </div>

  <div id="apply-wrap">
    <h2 id="apply-h">Apply — 6.5 and up</h2>
    <div id="apply"></div>
  </div>

  <div id="border-wrap"></div>
  <div id="aside-wrap"></div>
  <div id="excluded-wrap"></div>
  <div id="applied-wrap"></div>
  <div id="hidden-wrap"></div>

  <div class="sources" id="sources"></div>
  <div class="toast" id="toast" role="status"></div>

<script>
// Defaults only. scan.py writes the real values into status.json so the bands live in one
// place; if status.json is older than this page these are what you get.
let GATE = 6.5, FLOOR = 6.0;
// How far back the dashboard shows. The data keeps 45 days (scan.py's KEEP_DAYS) because
// the scan dedupes each run against everything already on the dashboard -- drop a row from
// jobs.json and the same role comes back tomorrow looking new -- so this is a view filter
// and nothing else. A role older than this is one that has been sat on for a week; the
// count of what's hidden is still shown, so nothing vanishes silently.
const MAX_AGE_DAYS = 7;
function ageDays(iso){
  if(!iso) return 0;                      // no date: treat as current, never hide blindly
  const d = (Date.now() - new Date(iso)) / 86400000;
  return isNaN(d) ? 0 : d;
}
function isRecent(iso){ return ageDays(iso) <= MAX_AGE_DAYS; }
const DIMS = [["experience","Exp"],["skills","Skills"],["seniority","Sen"],
              ["domain","Domain"],["location_visa","Loc/Visa"],["trajectory","Traj"]];

// The Shot/Want split. scan.py writes `shot` and `want` onto every row it touches, so
// normally this is just a read. The fallback covers the window between shipping the split
// and the next scan rewriting jobs.json: the arithmetic is the rubric's own weights,
// handed over in status.json (scan.py's SHOT_DIMS/WANT_DIMS) rather than copied here,
// because a second copy of the weights is a copy that drifts.
let SHOT_WANT = null;
function shotWant(j){
  if(j.shot != null && j.want != null) return [j.shot, j.want];
  const d = j.dimensions, cfg = SHOT_WANT;
  if(!d || !Object.keys(d).length || !cfg) return [null, null];
  const half = keys => {
    const total = keys.reduce((a,k)=>a + (cfg.weights[k]||0), 0);
    if(!total) return null;
    const sum = keys.reduce((a,k)=>a + (Number(d[k])||0) * (cfg.weights[k]||0), 0);
    return Math.round(sum / total * 10) / 10;
  };
  return [half(cfg.shot||[]), half(cfg.want||[])];
}

function loadSet(key){
  try{ return new Set(JSON.parse(localStorage.getItem(key)||"[]")); }
  catch(e){ return new Set(); }
}
function saveSet(key,set){ localStorage.setItem(key, JSON.stringify([...set])); }
function loadMap(key){
  try{ const m = JSON.parse(localStorage.getItem(key)||"{}");
       return (m && typeof m === "object" && !Array.isArray(m)) ? m : {}; }
  catch(e){ return {}; }
}
function saveMap(key,map){ localStorage.setItem(key, JSON.stringify(map)); }
let hiddenIds = loadSet("rr_hidden");
let appliedIds = loadSet("rr_applied");
// WHEN each id was hidden or marked applied. The sets alone could only answer "is this
// done", so the hidden/applied section was sorted by score -- which put a role applied to
// in July above one applied to this morning, in the one list whose whole question is
// "what have I just done". Ids marked before this existed have no timestamp; they sort
// after the dated ones rather than being given a date nobody recorded.
let hiddenAt = loadMap("rr_hidden_at");
// WHY a role was hidden, when he chose to say. Optional and after the fact: Hide is still
// one tap, and the reason is what the weekly review reads to tell a targeting problem
// (the radar keeps surfacing London roles he does not want) from a scoring one (it keeps
// rating too-junior roles as a 7). Each note carries a snapshot of the row, because
// jobs.json forgets a role after 45 days and the pattern is only visible over months.
let hideNotes = loadMap("rr_hide_notes");
// The reasons map onto the scorer's own dimensions and gates, so a pattern in them points
// at a specific thing to change rather than a general sense that the list is off.
const WHY_REASONS = [
  ["function", "Not my function"], ["junior", "Too junior"], ["senior", "Too senior"],
  ["location", "Location / visa"], ["pay", "Pay too low"],
  ["company", "Company / industry"], ["skills", "Skills I lack"],
  ["stale", "Closed / stale / duplicate"], ["other", "Other"]];
let appliedAt = loadMap("rr_applied_at");
// Which market and which track the list is filtered to, and whether the Shot floor is on.
// Local-only on purpose: they change what is on screen, not what happened to a role.
let filters = {
  market: localStorage.getItem("rr_market") || "all",
  track: localStorage.getItem("rr_track") || "all",
  shotOnly: localStorage.getItem("rr_shotOnly") === "1",
};
// Read once, at load, before anything renders: everything found after this is new to him.
// Written back immediately, so a refresh two minutes later does not still claim eleven
// new roles -- the dot is "since you last opened this", not "since this morning".
const LAST_VISIT = Number(localStorage.getItem("rr_last_visit") || 0);
try{ localStorage.setItem("rr_last_visit", String(Date.now())); }catch(e){}
function isNew(j){
  return LAST_VISIT > 0 && j.found_at && new Date(j.found_at).getTime() > LAST_VISIT;
}
// scan.py writes `track` on every row; the fallback is for rows stored before it did.
// Same regex as scan.py's is_csm_title().
function trackOf(j){
  return j.track || (/customer success/i.test(j.title||"") ? "cs" : "revops");
}
const MARKET_CHIPS = [["all","All"],["NL","NL"],["IE","IE"],["UK-London","London"],
                      ["BE","BE"],["CA","CA"],["US-Remote","US"]];
const TRACK_CHIPS = [["all","All"],["revops","RevOps"],["cs","CS"]];
function marketOf(j){ return j.tier || j.market || ""; }
function passesFilters(j){
  if(filters.market !== "all" && marketOf(j) !== filters.market) return false;
  if(filters.track !== "all" && trackOf(j) !== filters.track) return false;
  if(filters.shotOnly){ const sh = shotWant(j)[0]; if(sh != null && sh < GATE) return false; }
  return true;
}

// A row that absorbed duplicates carries their ids in dupe_ids. Hide / Mark applied are
// recorded against whichever id was on screen at the time, so state has to be looked up
// against every id a row stands for -- otherwise collapsing a duplicate would silently
// un-apply a job that had already been applied to.
function idsOf(j){ return [String(j.id||""), ...((j.dupe_ids||[]).map(String))]; }
function marked(set, j){ return idsOf(j).some(id=>set.has(id)); }
// WHICH of a row's ids carries the mark, so the timestamp recorded against a folded-away
// duplicate is still found.
function markedId(set, j){ return idsOf(j).find(id=>set.has(id)) || ""; }
// When a row was hidden or marked applied, as a sortable string. "" for a mark made
// before timestamps existed, which sorts last.
function markTime(j){
  return appliedAt[markedId(appliedIds, j)] || hiddenAt[markedId(hiddenIds, j)] || "";
}
let syncApi = false; // becomes true once Firebase responds

// Cross-device sync: a Firebase Realtime Database node holds the shared state.
// If it's unreachable, everything still works on localStorage alone -- this is
// a strict enhancement layer, never a hard dependency.
const FIREBASE_STATE_URL = "https://revops-radar-2822a-default-rtdb.europe-west1.firebasedatabase.app/revops-radar-state.json";

// "Mark applied" also adds the role to the Applications tab of Networking Tracker, the
// sheet Tom used to fill in by hand. The receiving end is tools/tracker-append.gs, an Apps
// Script web app on the sheet itself. Its URL is public (it is in this file); the token that
// lets a request through is not, so it lives in this browser's localStorage and is asked
// for once per device. Empty URL = feature off, and Mark applied behaves as it always did.
const TRACKER_URL = "";

// The sheet records the country, not the city, in the words Tom has always used.
const TRACKER_COUNTRY = {
  "NL": "Netherlands", "nl": "Netherlands",
  "IE": "Ireland", "IE-Dublin": "Ireland", "ie": "Ireland",
  "UK-London": "UK", "gb": "UK", "uk": "UK",
  "BE": "Belgium", "be": "Belgium",
  "CA": "Canada", "ca": "Canada",
  "US-Remote": "US-Remote", "us": "US-Remote",
};
function trackerCountry(j){
  const m = j.tier || j.market || "";
  if(TRACKER_COUNTRY[m]) return TRACKER_COUNTRY[m];
  const parts = String(j.location || "").split(",").map(x=>x.trim()).filter(Boolean);
  return parts.length ? parts[parts.length-1] : m;
}

let toastTimer = null;
function toast(msg, kind){
  const t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg; t.className = "toast on " + (kind || "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.className = "toast"; }, kind === "bad" ? 6000 : 2500);
}

function trackerToken(){
  let tok = "";
  try { tok = localStorage.getItem("rr_tracker_token") || ""; } catch(e){}
  if(tok) return tok;
  tok = (prompt("Tracker token (set once per device, to add applied roles to Networking Tracker). Leave blank to skip.") || "").trim();
  if(tok){ try { localStorage.setItem("rr_tracker_token", tok); } catch(e){} }
  return tok;
}

// Fire-and-forget: the Applied mark is already saved and synced before this runs, so a
// failure here only means the sheet row has to be added by hand, and the toast says so.
// text/plain keeps it a "simple" request; Apps Script cannot answer a CORS preflight.
function logToTracker(j){
  if(!TRACKER_URL || !j) return;
  const token = trackerToken();
  if(!token) return;
  const body = {token, company: j.company || "", title: j.title || "",
                location: trackerCountry(j),
                score: j.score == null ? "" : Number(j.score).toFixed(1),
                link: j.url || ""};
  fetch(TRACKER_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
                      body: JSON.stringify(body)})
    .then(r=>r.json())
    .then(res=>{
      if(res && res.ok) toast(res.dup ? "Already in Networking Tracker" : "Added to Networking Tracker", "ok");
      else {
        if(res && res.error === "bad token"){ try { localStorage.removeItem("rr_tracker_token"); } catch(e){} }
        toast("Tracker not updated (" + ((res && res.error) || "error") + ") — add it by hand", "bad");
      }
    })
    .catch(()=>toast("Tracker not updated — add it by hand", "bad"));
}

// The apply queue is mothballed -- applications are made by hand again, through the
// job-application-workflow skill in a Claude project. So the button that used to queue a
// role now hands it over instead: one tap puts everything the skill would otherwise have
// to be told onto the clipboard.
//
// The point of the block is that the skill no longer scores. It reads the number the radar
// already computed, which is why the dimensions and the flags travel with it and not just
// the description: a flag is the difference between "tailor against this ad" and "the ad
// was never retrieved, go and get it".

// scan.py's MIN_DESC_CHARS. A row under it was never really read, whatever else is on it.
const MIN_DESC_CHARS = 900;
function isThin(j){
  return (j.desc_chars ?? (j.description||"").length) < MIN_DESC_CHARS
      || (j.flags||[]).some(f=>/thin evidence/i.test(f));
}

function packetFor(j){
  const L = [];
  // Ahead of everything, because it changes what the rest of the block is for. A
  // revopsroles.com stub arrives as ~50 characters of synthesized summary; tailoring a CV
  // against that is tailoring against a title. The skill is told to stop and ask for the
  // real ad, and this is the line it reads to know that.
  if(isThin(j)){
    L.push("WARNING: the radar never retrieved the real posting for this role.",
           "The text below is a stub, not the ad. Open the posting link, copy the real",
           "description, and paste it in place of the JD section before tailoring anything.",
           "The sponsorship and language checks did not run on this row either.", "");
  }
  L.push("RADAR ROLE",
         "Company: " + (j.company || "?"),
         "Title: " + (j.title || "?"),
         "Location: " + (j.location || "?"),
         "Market: " + (j.tier || j.market || "?"));
  const d = j.dimensions || {};
  const dimStr = DIMS.map(([k,l])=>`${l} ${d[k] ?? "?"}`).join(", ");
  // A set-aside row was never scored, and "0.0" would read as "the radar rated this
  // zero" -- the opposite of what happened, and a reason to skip a role nobody assessed.
  L.push(isSetAside(j)
    ? "Radar score: NOT SCORED (no posting text was ever retrieved; not screened either)"
    : `Radar score: ${(j.score ?? 0).toFixed(1)}  (${dimStr})`);
  // The same six dimensions split in two, so the skill knows which problem this role is.
  // A high Want with a low Shot is a role to fight for on the CV; the reverse is a role
  // to apply to quickly and not agonise over.
  const [pShot, pWant] = shotWant(j);
  if(pShot != null && pWant != null){
    L.push(`Shot ${pShot.toFixed(1)} (experience, skills, seniority — can you get the interview)`,
           `Want ${pWant.toFixed(1)} (domain, location, trajectory — do you want the job)`);
  }
  if((j.hard_gaps||[]).length){
    L.push("Hard gaps (stated must-haves you do not meet — address these first):",
           ...(j.hard_gaps||[]).map(g=>"  - " + g));
  }
  if(j.verdict) L.push("Radar verdict: " + j.verdict);
  // UK and NL only. Ireland runs permits rather than a register, and neither North
  // American market needs sponsorship at all, so the field is noise there.
  if(j.sponsor && /^(UK|NL)$/.test(j.sponsor_region||"")) L.push("Sponsor: " + j.sponsor);
  const c = j.comp || {};
  // Only a figure the posting itself states ever lands here -- scan.py discards board
  // estimates (salary_is_predicted) precisely so this line cannot be mistaken for one.
  // The whole band, not just the bottom. The floor check reads the top now, and a bare
  // bottom figure is what made "$120,000 - $150,000" look like a $120,000 role.
  const fmt = n => Number(n).toLocaleString("en-US");
  L.push(c.stated && c.min_base
    ? `Comp stated in the posting: ${c.currency||""} ${fmt(c.min_base)}`
      + (c.max_base && c.max_base > c.min_base ? `-${fmt(c.max_base)}` : "") + " base"
    : "Comp stated in the posting: no");
  if(j.market_conflict){
    L.push(`LOCATION CONFLICT: the posting says ${j.market_conflict.stated} ` +
           `(${j.market_conflict.resolves_to}), the radar has it as ${j.tier||j.market||"?"}. ` +
           `Resolve this before building anything -- it picks the CV contact block and the floor.`);
  }
  if((j.flags||[]).length) L.push("Flags:", ...(j.flags||[]).map(f=>"  - " + f));
  L.push("Posting: " + (j.url || "?"));
  if(j.apply_url && j.apply_url !== j.url) L.push("Application form: " + j.apply_url);
  // The stored ad is the whole ad now -- scan.py's DESC_STORE_CAP is 30000, past the
  // longest posting on record -- so the complete branch is the normal one. The sampled
  // branch survives for two shrinking cases: rows scored under the old 1200-char cap that
  // `scan.py --backfill-jd` could not re-fetch, and a freak posting longer than the guard.
  // It stays because it is still true when it fires, and a sample presented as an ad is
  // the one thing worse than a short one: what a head-and-tail cut drops is the middle,
  // which is where the responsibilities are.
  const stored = j.description || "";
  const full = j.desc_chars ?? stored.length;
  const sampled = stored.includes("\n[...]\n");
  if(sampled){
    // Keep this prefix exactly as it is. SKILL.md's Step 0 table matches on it.
    L.push("", `JD: SAMPLE ONLY -- ${stored.length} of ${full} characters, middle missing. ` +
               `Paste the full ad from the posting link if you need the requirements.`);
  } else {
    L.push("", `JD (${full} chars, complete):`);
  }
  L.push(stored || "(none retrieved)");
  return L.join("\n");
}

function copyPacket(j, btn){
  const text = packetFor(j);
  const done = (ok)=>{
    // The label is the only feedback there is, and a copy that silently failed looks
    // exactly like one that worked until you paste. So say which happened.
    const was = btn.textContent;
    btn.textContent = ok ? "Copied" : "Copy failed";
    setTimeout(()=>{ btn.textContent = was; }, 1600);
  };
  // navigator.clipboard needs a secure context and is absent on some mobile browsers, so
  // fall through to the old selection trick rather than leaving the button dead.
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>done(true), ()=>done(fallbackCopy(text)));
  } else {
    done(fallbackCopy(text));
  }
}
function fallbackCopy(text){
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.top = "-1000px";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

async function syncFromServer(){
  try{
    const r = await fetch(FIREBASE_STATE_URL);
    if(!r.ok) return;
    const server = await r.json();
    syncApi = true;
    if(server){
      // merge (union) so nothing recorded locally before sync existed gets lost
      // Firebase omits empty-array fields entirely, so treat missing as []
      (Array.isArray(server.hidden) ? server.hidden : []).forEach(id=>hiddenIds.add(id));
      (Array.isArray(server.applied) ? server.applied : []).forEach(id=>appliedIds.add(id));
      // The timestamps ride as a list of {id, at} rather than as an object keyed by id:
      // job ids come from seven different sources and Firebase rejects a key containing
      // . $ # [ ] or /, which would lose the mark rather than just the date. Oldest
      // recorded time wins on a merge -- when a role was marked is a fact about the past,
      // and two devices disagreeing means one of them recorded it late.
      const mergeAt = (rows, into) => (Array.isArray(rows) ? rows : []).forEach(r=>{
        if(!r || !r.id || !r.at) return;
        if(!into[r.id] || String(r.at) < String(into[r.id])) into[r.id] = String(r.at);
      });
      mergeAt(server.hidden_at, hiddenAt);
      // Newest note wins: unlike the timestamps, a reason is something he can revise.
      (Array.isArray(server.hide_notes) ? server.hide_notes : []).forEach(n=>{
        if(!n || !n.id || !n.at) return;
        const mine = hideNotes[n.id];
        if(!mine || String(n.at) > String(mine.at)){
          const {id, ...rest} = n; hideNotes[id] = rest; }
      });
      saveMap("rr_hide_notes", hideNotes);
      mergeAt(server.applied_at, appliedAt);
      saveSet("rr_hidden", hiddenIds); saveSet("rr_applied", appliedIds);
      saveMap("rr_hidden_at", hiddenAt); saveMap("rr_applied_at", appliedAt);
    }
    const note = document.getElementById("synclabel");
    if(note) note.textContent = "Hide / Mark applied sync across your devices.";
  }catch(e){ /* Firebase unreachable -- stay on localStorage only */ }
}
// Still PATCH, not PUT, even though nothing writes `queued` from the other side any more.
// A PUT would delete the node's other keys, and the mothballed apply queue's state is worth
// leaving intact for whenever it comes back.
function pushState(){
  if(!syncApi) return;
  const pairs = m => Object.entries(m).map(([id,at])=>({id, at}));
  fetch(FIREBASE_STATE_URL, {method:"PATCH", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({hidden:[...hiddenIds], applied:[...appliedIds],
                          hidden_at: pairs(hiddenAt), applied_at: pairs(appliedAt),
                          hide_notes: Object.entries(hideNotes).map(([id,n])=>({id, ...n}))})})
    .catch(()=>{});
}

// Titles, companies and verdicts come from scraped HTML and go into innerHTML, so they get
// escaped here. scan.py already decodes entities on the way in, so this doesn't double up.
const ESCAPES = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c=>ESCAPES[c]); }

function fresh(iso){
  if(!iso) return "";
  const d = (Date.now() - new Date(iso)) / 86400000;
  if(d < 1) return "today"; if(d < 2) return "yesterday";
  return Math.floor(d) + "d ago";
}
function scoreClass(s){ return s == null ? "s-none"
                       : s >= 8 ? "s-apply" : s >= GATE ? "" : "s-border"; }

// Where a row's market sits in Tom's ordering. Read from status.json (scan.py's
// MARKET_TIER) with a fallback that sorts an unknown market LAST rather than first, so a
// market added to the code before the dashboard has seen it cannot jump the queue.
let MARKET_TIER = {}, TIER_UNKNOWN = 9;
function tierOf(j){ return MARKET_TIER[j.tier || j.market || ""] ?? TIER_UNKNOWN; }
function byScore(a,b){
  return ((b.score??0) - (a.score??0))
      || String(b.found_at||"").localeCompare(String(a.found_at||""));
}

// A row set aside for having no posting text. It is not scored and not rejected -- the
// recovery routes all came back empty, so nothing about it has been examined.
function isSetAside(j){ return j.evidence === "thin" || j.score == null; }

function card(j, reviewed){
  const id = String(j.id||"");
  // "—" rather than 0.0. A set-aside row has no score, and rendering one as the bottom of
  // the scale is the exact misreading this whole section exists to stop.
  const s = isSetAside(j) ? "—" : (j.score ?? 0).toFixed(1);
  const el = document.createElement("div"); el.className = "job" + (reviewed ? " reviewed" : "");
  const dims = (j.dimensions && Object.keys(j.dimensions).length)
    ? `<div class="dims">${DIMS.map(([k,l])=>`${l} <b>${(j.dimensions[k]??0)}</b>`)
        .join(" · ")}</div>` : "";
  let spon = "";
  if(j.sponsor){
    const good = /sponsor/i.test(j.sponsor) && !/not on/i.test(j.sponsor);
    spon = `<span class="tag ${good?'spon':'nospon'}">${j.sponsor}</span>`;
  }
  // Two kinds of thing were sharing one row of pills. A handful are short facts -- a
  // title band, a CSM-outside-NL note, whether pay is confirmed -- and read fine as
  // pills. The rest are the scorer's risk notes: full sentences, cut at 70 characters,
  // overflowing the card, and the most useful text on it. They get their own block below
  // the verdict, at full length.
  const PILL_FLAGS = [/^title band:/i, /^CSM in /i, /^no pay stated/i,
                      /^pay not confirmed/i, /^comp not listed/i, /^band \d/i,
                      /^model read the function/i];
  // The location conflict has its own pill already, which says the same thing with the
  // markets in it; repeating it as a watch-out is noise.
  const notes = (j.flags||[]).filter(f=>!PILL_FLAGS.some(rx=>rx.test(f))
                                        && !/^location conflict:/i.test(f));
  const flags = (j.flags||[]).filter(f=>PILL_FLAGS.some(rx=>rx.test(f)))
    .map(f=>`<span class="tag flag">${esc(f)}</span>`).join("");
  const watch = notes.length
    ? `<div class="watch"><div class="wh">Watch-outs</div><ul>`
      + notes.map(f=>`<li>${esc(f)}</li>`).join("") + `</ul></div>` : "";
  // What the ad says it requires and the profile does not have. First in the tag row,
  // ahead of every risk note, because it is the one thing that decides whether applying
  // is worth the evening.
  const gapTags = (j.hard_gaps||[]).map(g=>
    `<span class="tag gap" title="A stated must-have in this ad that your profile does not meet"
     >&#9888; ${esc(g)}</span>`).join("");
  // Shot and Want, computed by scan.py from the stored dimensions. Shown under the score
  // rather than inside the dimension strip: this is the split the decision turns on, and
  // the strip is six numbers nobody reads at a glance.
  const [cShot, cWant] = shotWant(j);
  const sw = (cShot != null && cWant != null)
    ? `<div class="sw" title="Shot: experience, skills and seniority — can you get the interview. Want: domain, location and trajectory — do you want the job."
       ><div class="${cShot < FLOOR ? 'lo' : ''}">Shot <b>${cShot.toFixed(1)}</b></div>`
      + `<div>Want <b>${cWant.toFixed(1)}</b></div></div>` : "";
  // Pay, which this card has never shown. `salary` is populated on a few hundred rows and
  // was rendered nowhere, so a Versapay row whose feed said 110000-130000 USD displayed
  // "comp not listed" and nothing else. Where it came from is part of the fact: a figure
  // the scorer read in the ad is confirmed, a figure off the feed still wants checking.
  const payTag = (() => {
    const c = j.comp || {};
    const fmt = n => Number(n).toLocaleString("en-US");
    if(c.stated && c.min_base){
      const band = fmt(c.min_base)
        + (c.max_base && c.max_base > c.min_base ? `–${fmt(c.max_base)}` : "");
      return `<span class="tag pay" title="Read off the posting by the scorer">`
           + `${esc(c.currency||"")} ${band}</span>`;
    }
    if(j.salary) return `<span class="tag pay est" title="From the job feed, not confirmed `
      + `in the posting text">${esc(j.salary)} (feed)</span>`;
    return "";
  })();
  // The market, marked by tier so the backups read as backups at a glance rather than
  // needing the reader to remember which of six names is which.
  const tier = tierOf(j);
  const marketTag = j.tier
    ? `<span class="tag market t${tier}" title="${tier===1?"Primary market"
        :tier===2?"Strong option":tier===3?"Backup":"Last resort — remote RevOps only"}"
       >${esc(j.tier)}</span>`
    : "";
  // Sits next to the market it disputes rather than down among the flags, because this one
  // is not a risk note to weigh -- it means the CV's contact block and the form's visa
  // answers are being picked off a market the posting itself contradicts. The apply queue
  // asks before it builds anything; this is so the disagreement is visible without opening
  // the role at all.
  const conflictTag = j.market_conflict
    ? `<span class="tag conflict" title="The posting says ${esc(j.market_conflict.stated)}. Resolve this before tailoring: the market picks the CV contact block and the salary floor."
       >&#9888; says ${esc(j.market_conflict.resolves_to)}, not ${esc(j.tier||"?")}</span>`
    : "";
  // Only on US rows, and only when the employer's own board shows they hire somewhere Tom
  // wants to live. That is the difference between a dead end and a route abroad without
  // changing employer, and it is what lifts the US score band from 2-3 to 4-5.
  const transferTag = j.transfer_markets
    ? `<span class="tag transfer"
         title="This employer also posts roles here, so an internal move later is a route abroad"
       >&#8599; also hires in ${esc(j.transfer_markets)}</span>`
    : "";
  // Which board the application actually lives on, and whether /submit can fill it
  // without being asked. Read off scan.py's own classification (submit.application_status,
  // written into ats/ats_fillable at scan time) rather than guessed here: it is the same
  // read-the-row-first pass /submit itself makes, minus the company-board lookup that
  // costs a network round trip and only runs when a role is actually queued. So "no badge"
  // means "not known to be fillable without asking", not "definitely not" -- a 9.0 with no
  // badge is still worth /submit, and worth applying to by hand either way.
  // Where the application actually is, when scan.py's board lookup found it and the row's
  // own link is somewhere else. Half these rows arrive through an aggregator -- LinkedIn,
  // revopsroles, hiring.cafe -- and "View posting" then opens an advert with no form on
  // it. This is the form, and it is the same URL /submit would fill.
  const applyLink = (j.apply_url && j.apply_url !== j.url)
    ? `<a href="${esc(j.apply_url)}" target="_blank" rel="noopener"
         title="The application form itself, not the advert">Apply &rarr;</a>`
    : "";
  // No ATS badge. It answered "could the bot fill this form", and the bot is mothballed
  // -- applications are made by hand through the Claude project now. scan.py still writes
  // ats/ats_fillable (the apply-link state is derived from them, and the mothballed code
  // reads them), they are simply not something to read on a card any more. The "Apply →"
  // link below stays: that is where he actually applies.
  // Score caps were retired: the score is now the weighted rubric total and nothing clamps
  // it. Rows scored before that still carry caps_applied, so they keep rendering here,
  // labelled so it's clear the ceiling no longer applies to anything new. New rows have an
  // empty array and show these tags not at all; their risk notes arrive as ordinary flags.
  const caps = (j.caps_applied||[]).map(c=>`<span class="tag cap">capped (legacy): ${esc(c)}</span>`).join("");
  const rawNote = (j.caps_applied||[]).length && j.score_raw != null
    ? `<span class="tag cap">scored ${Number(j.score_raw).toFixed(1)} before the cap; rescan to clear</span>` : "";
  // Sources that had the same posting and were collapsed into this row, so a duplicate
  // reads as one entry with two places to open it rather than two entries.
  const also = (j.also_seen||[]).length
    ? " · also on " + (j.also_seen||[]).map(a=>a.url
        ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.source)}</a>`
        : esc(a.source)).join(", ")
    : "";
  // An Adzuna row that could not be read is a permanent set-aside: its link is an
  // interstitial redirect rather than the ad, so there is nothing behind it to open and
  // no route to the posting. Say so on the card rather than letting him find out.
  const deadEnd = (isSetAside(j) && j.source === "adzuna" && !(j.also_seen||[]).length)
    ? `<div class="watch"><div class="wh">Nothing to open</div><ul><li>Adzuna links go to a
        redirect page, not the ad, so this one cannot be recovered. Search the company's
        own careers page if the title looks worth it.</li></ul></div>` : "";
  // When it was hidden or applied to, on the reviewed cards only. The sections sort by
  // this, so the date has to be visible or the order looks arbitrary.
  const markedAt = reviewed
    ? (appliedAt[markedId(appliedIds, j)] || hiddenAt[markedId(hiddenIds, j)] || "")
    : "";
  const actions = reviewed
    ? `<div class="actions"><span class="status">${marked(appliedIds, j) ? "Applied" : "Hidden"}${
          markedAt ? " " + fresh(markedAt) : ""}</span>
        ${marked(appliedIds, j) ? "" : `<button data-act="why" data-id="${id}">${
          hideNote(j) ? "Edit why" : "Why?"}</button>`}
        <button data-act="restore" data-id="${id}">Restore</button></div>
      ${!marked(appliedIds, j) && hideNote(j) ? `<div class="whynote">${esc(whyText(hideNote(j)))}</div>` : ""}`
    : `<div class="actions">
        <button data-act="copy" data-id="${id}"
          title="Copy the score, flags and the ad, ready to paste into the Claude project"
        >Copy for Claude</button>
        <button data-act="hide" data-id="${id}">Hide</button>
        <button data-act="applied" data-id="${id}">Mark applied</button>
      </div>`;
  el.innerHTML = `
    <div class="row1">
      <div class="scorecol">
        <div class="score ${scoreClass(j.score)}">${s}</div>
        ${sw}
      </div>
      <div class="hd">
        <div class="title">${isNew(j) && !reviewed ? '<span class="newdot" title="Found since you last opened this page"></span>' : ""}${esc(j.title||"")}</div>
        <div class="company">${esc([j.company, j.location].filter(Boolean).join(" · "))}</div>
      </div>
    </div>
    ${j.verdict?`<div class="verdict">${esc(j.verdict)}</div>`:""}
    <div class="tags">${marketTag}${payTag}${gapTags}${conflictTag}${transferTag}${spon}${rawNote}${caps}${flags}</div>
    ${watch}${deadEnd}
    ${dims}
    <div class="foot">
      <a href="${j.url||'#'}" target="_blank" rel="noopener">View posting &rarr;</a>
      ${applyLink}
      <span class="src">${j.source||""}${also} · ${fresh(j.found_at)}</span>
    </div>
    ${actions}`;
  return el;
}

let allJobs = [], allStatus = {}, allExcluded = {};

// Human labels for the pipeline stage a row was dropped at.
const STAGE_LABELS = {
  "prefilter": "Filtered on title or location (free, before any model call) — one example per distinct title",
  "age": "Older than the age limit",
  "dedupe": "Same role already on the dashboard",
  "no-sponsorship": "The ad itself rules out visa sponsorship — its own words are quoted below",
  "language-required": "Requires fluency in a language other than English — quoted below, or noted by the deep scorer when the wording didn't match the regex",
  "below-visa-floor": "Stated salary is below the market's visa floor — the deep scorer read it off the ad",
  "below-comp-floor": "Stated salary is below your own floor for taking a US role — the deep scorer read it off the ad",
  "us-comp-unstated": "US role with no salary published anywhere — a US move is only worth it at confirmed pay, so it is dropped before scoring",
  "thin-evidence": "No real job description could be retrieved, so this was scored on the title, company and location alone — and the sponsorship and language checks never ran",
  "stage1-kill": "Killed by the cheap Haiku screen — run scan.py --unkill to reconsider these",
  "sponsor-required": "Company not on a sponsor register",
  "score-error": "Scoring failed — these retry automatically on the next run",
};

function dropRow(d){
  const el = document.createElement("div"); el.className = "drop";
  const who = [d.company, d.location].filter(Boolean).join(" · ");
  el.innerHTML = `<div class="dt">${esc(d.title || "(untitled)")}</div>
    <div class="dr">${esc(who)}${who ? " — " : ""}${esc(d.reason || "")}
      <span style="color:var(--mut)">· ${esc(d.source || "")} · ${fresh(d.dropped_at)}</span></div>`;
  return el;
}

function renderExcluded(lowScored){
  const wrap = document.getElementById("excluded-wrap");
  const wasOpen = wrap.querySelector("details")?.open ?? false;
  wrap.innerHTML = "";
  const rows = (allExcluded.rows || []).filter(r=>isRecent(r.dropped_at));
  const counts = allExcluded.counts || {};
  const totalDropped = Object.values(counts).reduce((a,b)=>a+b, 0);
  if(!lowScored.length && !rows.length) return;

  const d = document.createElement("details"); d.className = "excluded"; d.open = wasOpen;
  const bits = [];
  if(lowScored.length) bits.push(`${lowScored.length} scored under ${FLOOR.toFixed(1)}`);
  if(totalDropped) bits.push(`${totalDropped} dropped in the latest run`);
  bits.push(`last ${MAX_AGE_DAYS} days`);
  d.innerHTML = `<summary>Excluded — ${bits.join(", ")} · check these if the good ones look thin</summary>`;
  const box = document.createElement("div"); box.style.marginTop = "10px";

  if(lowScored.length){
    const h = document.createElement("div"); h.className = "subhead";
    h.textContent = `Scored under ${FLOOR.toFixed(1)}`;
    box.appendChild(h);
    lowScored.forEach(j=>box.appendChild(card(j, false)));
  }

  // Grouped by stage, in pipeline order, so it reads as "where did things go".
  const byStage = {};
  rows.forEach(r=>{ const g = String(r.stage||"").split(":")[0];
                    (byStage[g] = byStage[g] || []).push(r); });
  // Rows are a rolling log across runs; counts are this run only. Label both rather than
  // implying one is a subset of the other.
  Object.keys(STAGE_LABELS).filter(g=>byStage[g]).forEach(g=>{
    const shown = byStage[g];
    const thisRun = Object.entries(counts)
      .filter(([k])=>k.split(":")[0]===g).reduce((a,[,v])=>a+v, 0);
    const h = document.createElement("div"); h.className = "subhead";
    h.textContent = `${STAGE_LABELS[g]} — ${shown.length} logged`
      + (thisRun ? ` · ${thisRun} in the latest run` : "");
    box.appendChild(h);
    shown.forEach(r=>box.appendChild(dropRow(r)));
  });

  d.appendChild(box); wrap.appendChild(d);
}

function renderChips(id, defs, key, counts){
  const box = document.getElementById(id);
  box.querySelectorAll("button").forEach(b=>b.remove());
  defs.forEach(([val, label])=>{
    const n = counts[val] ?? 0;
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button";
    b.setAttribute("aria-pressed", String(filters[key] === val));
    b.innerHTML = `${esc(label)}<span class="n">${n}</span>`;
    // A market with nothing in it is still shown -- a count of 0 is the answer to "is
    // there anything in Belgium this week" -- but there is nothing to filter to.
    b.disabled = n === 0 && val !== "all" && filters[key] !== val;
    b.addEventListener("click", ()=>{
      filters[key] = val;
      try{ localStorage.setItem(key === "market" ? "rr_market" : "rr_track", val); }catch(e){}
      renderAll();
    });
    box.appendChild(b);
  });
}

// The one chip that is a toggle rather than a choice: hide the roles whose Shot score
// says the screen would stop him. Unscored rows are never hidden by it -- those are the
// ones that need his eyes.
function shotChip(){
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.id = "shotchip";
  b.setAttribute("aria-pressed", String(filters.shotOnly));
  b.title = "Hide roles whose Shot score says the screen would stop you. Unscored rows "
          + "are never hidden — those are the ones that need your eyes.";
  b.textContent = `Shot ${GATE.toFixed(1)}+`;
  b.addEventListener("click", ()=>{
    filters.shotOnly = !filters.shotOnly;
    try{ localStorage.setItem("rr_shotOnly", filters.shotOnly ? "1" : "0"); }catch(e){}
    renderAll();
  });
  return b;
}

function renderAll(){
  let jobs = allJobs.filter(j=>!marked(hiddenIds, j) && !marked(appliedIds, j));
  const reviewed = allJobs.filter(j=>marked(hiddenIds, j) || marked(appliedIds, j));
  const staleCount = jobs.filter(j=>!isRecent(j.found_at)).length;
  jobs = jobs.filter(j=>isRecent(j.found_at));

  // Counts are taken BEFORE the filters are applied, against everything currently
  // showable, so a chip says how many roles that market has rather than how many survive
  // the filter already on -- otherwise every chip but the chosen one reads 0.
  //
  // Only Apply and Borderline rows are counted. The chip is answering "how many roles
  // worth looking at are in Belgium", and a count padded with rows scored under the floor
  // (or never scored) says there is more there than there is.
  const countable = j=>!isSetAside(j) && (j.score??0) >= FLOOR;
  const countBy = (rows, of, defs)=>{
    rows = rows.filter(countable);
    const c = {all: rows.length};
    defs.forEach(([v])=>{ if(v !== "all") c[v] = 0; });
    rows.forEach(r=>{ const k = of(r); if(k in c) c[k]++; });
    return c;
  };
  const byTrack = jobs.filter(j=>filters.track === "all" || trackOf(j) === filters.track);
  const byMarket = jobs.filter(j=>filters.market === "all" || marketOf(j) === filters.market);
  renderChips("marketchips", MARKET_CHIPS, "market", countBy(byTrack, marketOf, MARKET_CHIPS));
  renderChips("trackchips", TRACK_CHIPS, "track", countBy(byMarket, trackOf, TRACK_CHIPS));
  // Rebuilt with the track chips, since renderChips clears the row it owns.
  document.getElementById("trackchips").appendChild(shotChip());

  const newCount = jobs.filter(isNew).length;
  // An unscored row has no Shot, and filtering it out would hide the rows that need his
  // eyes most. They are kept and land in their own section as always.
  jobs = jobs.filter(passesFilters);

  // Score order, highest first, and nothing else reorders it. Auto-fillable rows used to
  // float to the top of each section, which quietly put a 6.5 above an 8.4 because one of
  // them happened to be on a board with a driver -- convenience outranking fit, on the one
  // list whose whole job is to rank by fit. The checkmark still says which is which, and
  // the toggle above filters to them outright when that is what's wanted.
  // Overall score, highest first; newest first on a tie. Market tier used to come first,
  // which put a 6.6 in Amsterdam above an 8.4 in Dublin and made the list read as if it
  // were in no order at all. Market preference is already inside the score (the
  // location_visa dimension), and the market chips above filter to one outright.
  jobs = [...jobs].sort(byScore);

  // Split off before anything is bucketed by score. A set-aside row has no score, and
  // `?? 0` would file it under "scored below the floor" -- which is the one thing it is
  // not. It was never scored at all.
  const setAside = jobs.filter(isSetAside);
  jobs = jobs.filter(j=>!isSetAside(j));

  const apply = jobs.filter(j=>(j.score??0) >= GATE);
  const border = jobs.filter(j=>(j.score??0) >= FLOOR && (j.score??0) < GATE);
  const lowScored = jobs.filter(j=>(j.score??0) < FLOOR);

  const lr = allStatus.last_run ? new Date(allStatus.last_run).toLocaleString("en-GB",
      {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "never";
  const since = LAST_VISIT ? new Date(LAST_VISIT).toLocaleString("en-GB",
      {weekday:"short",hour:"2-digit",minute:"2-digit"}) : "";
  document.getElementById("meta").textContent =
      (newCount ? `${newCount} new since ${since}  ·  ` : "")
      + `${apply.length} to apply, ${border.length} borderline`
      + (setAside.length ? `, ${setAside.length} unscored` : "")
      + (staleCount ? `  ·  ${staleCount} older than ${MAX_AGE_DAYS}d hidden` : "")
      + `  ·  last run ${lr}`;

  const a = document.getElementById("apply"); a.innerHTML = "";
  if(apply.length) apply.forEach(j=>a.appendChild(card(j, false)));
  else a.innerHTML = `<div class="empty">No roles at ${GATE}+ yet. The next daily run may surface some.</div>`;

  const borderWrap = document.getElementById("border-wrap");
  const borderWasOpen = borderWrap.querySelector("details")?.open ?? false;
  borderWrap.innerHTML = "";
  if(border.length){
    const d = document.createElement("details"); d.className = "borderline"; d.open = borderWasOpen;
    d.innerHTML = `<summary>${border.length} borderline (${FLOOR.toFixed(1)}–${(GATE-0.1).toFixed(1)}) — volume plays, weaker fit</summary>`;
    const box = document.createElement("div"); box.style.marginTop = "10px";
    border.forEach(j=>box.appendChild(card(j, false)));
    d.appendChild(box); borderWrap.appendChild(d);
  }

  // Between borderline and excluded on purpose: these are not rejects, and burying them
  // under "Excluded" would say they had been looked at and turned down. Open by default
  // the first time, because a collapsed section is a section nobody reads and the whole
  // point of these rows is that only Tom can judge them.
  const asideWrap = document.getElementById("aside-wrap");
  const asideWasOpen = asideWrap.querySelector("details")?.open;
  asideWrap.innerHTML = "";
  if(setAside.length){
    const d = document.createElement("details"); d.className = "borderline";
    d.open = asideWasOpen ?? true;
    d.innerHTML = `<summary>${setAside.length} unscored — no job description could be `
      + `found, so these were not screened or scored. Worth your own eyes.</summary>`;
    const box = document.createElement("div"); box.style.marginTop = "10px";
    const note = document.createElement("div"); note.className = "note";
    note.textContent = "Every recovery route came back empty for these: the source's own "
      + "page, the copies other feeds had, the company's own board, and a web search. "
      + "Nothing has been ruled out — the sponsorship and language checks need posting "
      + "text to run, so they never ran. Open the link and judge it yourself.";
    box.appendChild(note);
    setAside.forEach(j=>box.appendChild(card(j, false)));
    d.appendChild(box); asideWrap.appendChild(d);
  }

  renderExcluded(lowScored);

  // Applied and hidden are two different questions -- "what am I waiting to hear back
  // on" and "what did I throw away" -- and they were one collapsed section sorted by
  // score, which put a role applied to in July above one applied to this morning. Each
  // sorts newest-marked first now. A mark made before timestamps existed has no date and
  // sorts after the dated ones, by when the role was found.
  const applied = reviewed.filter(j=>marked(appliedIds, j));
  const hidden = reviewed.filter(j=>!marked(appliedIds, j));
  const byMark = (a,b)=> String(markTime(b)||"").localeCompare(String(markTime(a)||""))
                      || String(b.found_at||"").localeCompare(String(a.found_at||""));
  renderReviewed("applied-wrap", applied.sort(byMark), "Applied");
  renderReviewed("hidden-wrap", hidden.sort(byMark), "Hidden");
}

function hideNote(j){ const id = idsOf(j).find(x=>hideNotes[x]); return id ? hideNotes[id] : null; }
function whyText(n){
  const labels = Object.fromEntries(WHY_REASONS);
  return [ (n.reasons||[]).map(r=>labels[r]||r).join(", "), n.note ].filter(Boolean).join(" — ");
}
// The optional "why" panel, opened in place of a card's buttons. Nothing it does can undo
// the hide: Skip, Save or just scrolling on all leave the role hidden.
function openWhy(cardEl, id){
  const job = allJobs.find(j=>String(j.id||"") === id);
  const prev = (job && hideNote(job)) || hideNotes[id] || {};
  const picked = new Set(prev.reasons || []);
  const box = document.createElement("div"); box.className = "why";
  box.innerHTML = `<div class="wq">Hidden. What was wrong with it? Optional — this feeds the weekly review.</div>
    <div class="chips"></div>
    <input type="text" maxlength="280" placeholder="Anything else (optional)" value="${esc(prev.note||"")}">
    <div class="actions"><button data-save>Save</button><button data-skip>Skip</button></div>`;
  const chips = box.querySelector(".chips");
  WHY_REASONS.forEach(([code, label])=>{
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = label;
    b.setAttribute("aria-pressed", String(picked.has(code)));
    b.addEventListener("click", ev=>{
      ev.stopPropagation();
      picked.has(code) ? picked.delete(code) : picked.add(code);
      b.setAttribute("aria-pressed", String(picked.has(code)));
    });
    chips.appendChild(b);
  });
  box.querySelector("[data-save]").addEventListener("click", ev=>{
    ev.stopPropagation();
    const note = box.querySelector("input").value.trim().slice(0, 280);
    if(picked.size || note){
      hideNotes[id] = {at: new Date().toISOString(), reasons: [...picked], note,
        title: job?.title || "", company: job?.company || "", score: job?.score ?? null,
        market: job ? marketOf(job) : "", track: job ? trackOf(job) : ""};
    } else delete hideNotes[id];
    saveMap("rr_hide_notes", hideNotes); pushState(); renderAll();
  });
  box.querySelector("[data-skip]").addEventListener("click", ev=>{ ev.stopPropagation(); renderAll(); });
  const actions = cardEl.querySelector(".actions");
  (actions || cardEl.lastElementChild).replaceWith(box);
  box.querySelector(".chip")?.focus();
}

function renderReviewed(wrapId, rows, label){
  const wrap = document.getElementById(wrapId);
  const wasOpen = wrap.querySelector("details")?.open ?? false;
  wrap.innerHTML = "";
  if(!rows.length) return;
  const d = document.createElement("details"); d.className = "reviewed"; d.open = wasOpen;
  d.innerHTML = `<summary>${rows.length} ${esc(label.toLowerCase())} — most recent first</summary>`;
  const box = document.createElement("div"); box.style.marginTop = "10px";
  rows.forEach(j=>box.appendChild(card(j, true)));
  d.appendChild(box); wrap.appendChild(d);
}

document.body.addEventListener("click", (e)=>{
  const btn = e.target.closest("button[data-act]");
  if(!btn) return;
  const id = btn.dataset.id, act = btn.dataset.act;
  if(act === "hide"){
    hiddenIds.add(id); hiddenAt[id] = new Date().toISOString();
    saveSet("rr_hidden", hiddenIds); saveMap("rr_hidden_at", hiddenAt);
    // Recorded and synced now; the card stays put with the optional "why" panel in place
    // of its buttons, and leaves the list on Save or Skip.
    pushState();
    openWhy(btn.closest(".job"), id);
    return; }
  else if(act === "why"){
    openWhy(btn.closest(".job"), id);
    return; }
  else if(act === "applied"){
    appliedIds.add(id); appliedAt[id] = new Date().toISOString();
    saveSet("rr_applied", appliedIds); saveMap("rr_applied_at", appliedAt);
    pushState();
    renderAll();
    logToTracker(allJobs.find(j=>String(j.id||"") === id));
    return; }
  else if(act === "copy"){
    const job = allJobs.find(j=>String(j.id||"") === id);
    // Copying is not state: nothing to save, nothing to sync, and no reason to re-render
    // the list out from under a button that is mid-feedback.
    if(job) copyPacket(job, btn);
    return; }
  else if(act === "restore"){
    // Clear every id this row stands for, or an absorbed duplicate's old mark would put it
    // straight back into the hidden/applied section on the next render.
    const job = allJobs.find(j=>String(j.id||"") === id);
    (job ? idsOf(job) : [id]).forEach(x=>{
      hiddenIds.delete(x); appliedIds.delete(x);
      delete hiddenAt[x]; delete appliedAt[x]; delete hideNotes[x]; });
    saveMap("rr_hide_notes", hideNotes);
    saveSet("rr_hidden", hiddenIds); saveSet("rr_applied", appliedIds);
    saveMap("rr_hidden_at", hiddenAt); saveMap("rr_applied_at", appliedAt); }
  pushState();
  renderAll();
});

syncFromServer().then(renderAll);

Promise.all([
  fetch("jobs.json").then(r=>r.json()).catch(()=>[]),
  fetch("status.json").then(r=>r.json()).catch(()=>({})),
  // Strictly additive: an absent or malformed excluded.json just means no excluded section.
  fetch("excluded.json").then(r=>r.json()).catch(()=>({})),
]).then(([jobs, status, excluded])=>{
  jobs = (jobs||[]).filter(j=>!String(j.id||"").startsWith("demo-"));
  allJobs = jobs; allStatus = status || {}; allExcluded = excluded || {};
  // Read the thresholds and the market tiers from the code's own output before the first
  // render, so the bands and each card's market label are right on the very first paint.
  if(typeof allStatus.gate === "number") GATE = allStatus.gate;
  if(typeof allStatus.floor === "number") FLOOR = allStatus.floor;
  if(allStatus.market_tier && typeof allStatus.market_tier === "object")
    MARKET_TIER = allStatus.market_tier;
  if(allStatus.shot_want && allStatus.shot_want.weights)
    SHOT_WANT = allStatus.shot_want;
  jobs.sort(byScore);
  document.getElementById("apply-h").textContent = `Apply — ${GATE.toFixed(1)} and up`;
  renderAll();

  const s = allStatus.sources || {};
  const models = [allStatus.screen_model && `screen ${allStatus.screen_model}`,
                  allStatus.score_model && `score ${allStatus.score_model}`]
                 .filter(Boolean).join(" · ");
  document.getElementById("sources").innerHTML =
    "<div style='margin-bottom:6px;font-weight:650'>Sources this run</div>" +
    Object.entries(s).map(([k,v])=>{
      const bad = /fail|skipped|degraded/i.test(v);
      return `<div class="${bad?'bad':'ok'}">${esc(k)}: ${esc(v)}</div>`;
    }).join("") +
    (models ? `<div style="margin-top:8px">${esc(models)}</div>` : "");
}).catch(e=>{ document.getElementById("meta").textContent = "Could not load data: "+e; });
</script>
</body>
</html>
