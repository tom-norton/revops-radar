name: Apply queue

on:
  schedule:
    # Every 15 minutes. GitHub runs scheduled workflows on a best-effort basis and drops
    # or delays them under load, which is fine here: a missed tick just means the next
    # question arrives 15 minutes later. Nothing in this workflow is time-critical, and
    # nothing expires -- a gap interview waits for Tom however long it takes.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      message:
        description: "A message from Tom, relayed by the Telegram webhook. Leave blank."
        default: ""
      chat_id:
        description: "Chat the message came from. Set by the relay. Leave blank."
        default: ""
      dry:
        description: "Run the state machine without Claude calls, Telegram sends or commits"
        type: boolean
        default: false
      status:
        description: "Print the queue and what's in flight, then stop"
        type: boolean
        default: false

# Serial, and enforced here as well as in the code. Two overlapping ticks would both read
# the same run state out of the bullet bank, both advance it, and the second push would
# lose whichever answer the first one recorded.
concurrency:
  group: apply-queue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    # A tick that has just asked Tom something stays alive for ~10 minutes waiting for the
    # reply, so the whole role finishes in one run instead of waiting on the next firing.
    # This cap stops a wedged run holding the concurrency group for GitHub's 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Offline tests
        # Pure functions and the state machine, with the model calls and the chat stubbed.
        # Catches a broken comp gate or a regressed honesty rule before a tick spends money
        # or asks Tom a question it shouldn't.
        run: |
          python tests/test_scoring.py
          python tests/test_apply.py
          node tests/test_worker.mjs
      - name: Status only
        if: inputs.status
        env:
          BULLET_BANK_PAT: ${{ secrets.BULLET_BANK_PAT }}
        run: python applyq.py --status
      - name: Tick
        if: ${{ !inputs.status }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BULLET_BANK_PAT: ${{ secrets.BULLET_BANK_PAT }}
          # Present only when the Telegram relay started this run and handed Tom's message
          # along. When it is set, applyq.py uses it instead of polling -- a webhook and
          # getUpdates cannot both be active on one bot.
          APPLYQ_INBOUND: ${{ inputs.message }}
        run: python applyq.py ${{ inputs.dry && '--dry' || '' }}
