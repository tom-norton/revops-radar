name: Daily job scan

on:
  schedule:
    # THESE ARE THE BACKSTOP, NOT THE SCHEDULE. The real schedule lives in the Cloudflare
    # Worker (worker/wrangler.toml + scanDueAt()), which fires on time; these exist only so
    # the scan still happens if the Worker is undeployed, broken, or out of its free quota.
    #
    # The expressions below are correct and GitHub does not honour them. Measured over
    # 20 Aug - 3 Sep 2026, every firing arrived late and the lateness grew: 19-46 min in the
    # first week, then 2h12m to 5h13m by 1-3 Sep, with a stretch on 27-28 Aug where the
    # morning run landed after 19:00. The same scheduler gave apply.yml's every-fifteen-
    # minutes cron 35 firings of an expected ~576 over six days. Scheduled workflows are
    # best-effort and this repo is being deprioritised; no cron expression fixes that, which
    # is why punctuality moved to a scheduler that has some.
    #
    # Cron here is UTC with no DST awareness. These are the EST (UTC-5) instant of each
    # Worker slot -- the LATER of the two offsets -- so that whichever offset is in force,
    # the Worker's scan for a slot lands no earlier than 90 minutes before the matching
    # cron and the stand-down step below can see it. Under EDT a backstop that does run
    # (the Worker having missed) runs an hour behind Tom's clock, which costs nothing next
    # to how late GitHub delivers it anyway. tools/backstop.py has the full reasoning.
    - cron: "0 13 * * 1-5"   # 13:00 UTC weekdays (8am Eastern under EST)
    - cron: "30 17 * * 1-5"  # 17:30 UTC weekdays (12:30pm Eastern under EST)
    - cron: "0 1 * * 2-6"    # 01:00 UTC Tue-Sat (8pm Mon-Fri Eastern under EST)
    - cron: "0 14 * * 0,6"   # 14:00 UTC weekends (9am Eastern under EST)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Free past stage-1 kills from seen.json first (git history walk)"
        type: boolean
        default: false
      backfill_days:
        description: "How many days of docs/excluded.json history to walk"
        default: "14"
      ignore_age:
        description: "Relax the 7-day age filter for this run (pair with backfill)"
        type: boolean
        default: false
      backfill_jd:
        description: "Re-fetch full ads for rows stored under the old 1200-char cap, then stop"
        type: boolean
        default: false
      backfill_jd_days:
        description: "How many days back to re-fetch ads for"
        default: "7"

# Serial. The Worker and GitHub's own late cron can now both ask for a run, and every run
# ends by committing and pushing to main -- two overlapping ones would race on that push and
# one would lose its results. Queue the second rather than cancelling it: by the time it
# runs, seen.json has the first one's finds and it re-scores nothing.
concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # --unkill-history reads past commits of docs/excluded.json, so the default
          # single-commit checkout would find nothing to walk.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-jobspy
      - name: Scoring unit tests
        # Pure functions only -- no network, no API key. Catches a broken filter or a
        # mis-weighted rubric before it spends tokens producing wrong scores.
        run: python tests/test_scoring.py
      - name: Backfill full job descriptions
        # Repair of rows already on the dashboard, manual only. A carried-forward row is
        # never re-fetched by an ordinary run, so two kinds of row stay broken until they
        # age out: one truncated by the old 1200-char cap, and one that arrived as a stub
        # and has been holding a folded-away duplicate's link ever since. This goes and
        # gets both. The scan step below is skipped when this runs.
        #
        # The API key is here because a row that crosses from stub to real posting gets
        # rescored: its stored score was formed under EVIDENCE: THIN, with no ad to read,
        # and leaving that number next to the recovered ad would be the worse half of the
        # repair. Without the key the text is still recovered and the command says which
        # rows kept a score formed without one.
        if: inputs.backfill_jd
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scan.py --backfill-jd --days "${{ inputs.backfill_jd_days }}"

      - name: Free past stage-1 kills
        # Manual runs only. Use after loosening the screen or the scoring rules, to give
        # everything the old rules threw away a second look.
        if: inputs.backfill
        run: python scan.py --unkill-history --days "${{ inputs.backfill_days }}"
      - name: Skip a backstop run the Worker already covered
        # The Worker fires on time; these crons are the backstop and GitHub delivers them
        # 20 minutes to 5 hours late. On 17 Sep that meant four runs -- 13:00 dispatch,
        # 13:23 schedule, 17:22 schedule, 18:00 dispatch -- where the second of each pair
        # found nothing new and still paid for five Apify actor calls and up to 60 Adzuna
        # ones. Adzuna answered 503 on the later run almost every day, which is what a
        # free-tier quota already spent looks like.
        #
        # So a SCHEDULED run stands down when a scan already exists for its slot.
        # A dispatch never does: asking for a run by hand means you want one now. If the
        # Worker stops firing, nothing commits, and the next scheduled run goes ahead --
        # the backstop is intact, only the duplicate is gone.
        id: recent
        if: github.event_name == 'schedule'
        run: |
          # The scan's own commit, by message, rather than any commit touching
          # docs/status.json -- a hand edit to that file is not a scan and must not
          # make the backstop stand down.
          #
          # Stands down when a scan already exists for the SLOT this cron stands in for,
          # not merely when one ran in the last two hours -- GitHub delivering a backstop
          # three hours late used to get past that and run a duplicate scan, 5-6 a day
          # in all, and hiring.cafe ran the Apify plan dry on 1 Oct. See tools/backstop.py.
          last=$(git log -1 --format=%ct --grep="^scan:")
          python tools/backstop.py "${{ github.event.schedule }}" "$last" | tee /tmp/backstop
          grep -q "^skip=true$" /tmp/backstop && echo "skip=true" >> "$GITHUB_OUTPUT" || true

      - name: Run scanner
        # Skipped on a backfill run. The backfill is a repair of rows already scored; a scan
        # on top of it would spend a full budget of Haiku and Opus calls for no reason, and
        # the commit step below still runs either way so the repair gets pushed.
        if: ${{ !inputs.backfill_jd && steps.recent.outputs.skip != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scan.py ${{ inputs.ignore_age && '--ignore-age' || '' }}
      - name: Commit results
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          # board-cache.json is here for a reason: every run is a fresh checkout, so a
          # cache that is not committed is a cache that never survives one run to the
          # next -- and the whole point of it is that the ~200 companies with no public
          # board are asked once a month instead of every fifteen minutes.
          # deferred.json is committed for the same reason board-cache.json is: it is the
          # scoring queue's memory of which roles have been passed over, and a counter that
          # does not survive the checkout is a counter that can never escalate a role out
          # of the backlog. dealt.json is the re-post memory: company and title of what Tom
          # applied to or hid, kept after the row itself has aged off the dashboard.
          git add seen.json deferred.json dealt.json docs/jobs.json docs/status.json docs/excluded.json board-cache.json nl_sponsors_extra.txt 2>/dev/null || git add seen.json deferred.json dealt.json docs/jobs.json docs/status.json docs/excluded.json board-cache.json
          git diff --cached --quiet || git commit -m "scan: $(date -u +%F)"
          git push
