name: Daily job scan

on:
  schedule:
    # Cron here is UTC and has no DST awareness, so these are pinned to CET (UTC+1):
    # exact in winter, one hour later in local time during CEST. The morning slot is
    # deliberately late enough that the 10am revopsroles.com email has already landed
    # under either offset.
    - cron: "15 9 * * *"     # 09:15 UTC every day (10:15 CET / 11:15 CEST)
    - cron: "0 14 * * 1-5"   # 14:00 UTC weekdays only (3pm CET / 4pm CEST)
    - cron: "0 19 * * 1-5"   # 19:00 UTC weekdays only (8pm CET / 9pm CEST)
  workflow_dispatch:
    inputs:
      backfill:
        description: "Free past stage-1 kills from seen.json first (git history walk)"
        type: boolean
        default: false
      backfill_days:
        description: "How many days of docs/excluded.json history to walk"
        default: "14"
      ignore_age:
        description: "Relax the 7-day age filter for this run (pair with backfill)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # --unkill-history reads past commits of docs/excluded.json, so the default
          # single-commit checkout would find nothing to walk.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-jobspy
      - name: Scoring unit tests
        # Pure functions only -- no network, no API key. Catches a broken filter or a
        # mis-weighted rubric before it spends tokens producing wrong scores.
        run: python tests/test_scoring.py
      - name: Free past stage-1 kills
        # Manual runs only. Use after loosening the screen or the scoring rules, to give
        # everything the old rules threw away a second look.
        if: inputs.backfill
        run: python scan.py --unkill-history --days "${{ inputs.backfill_days }}"
      - name: Run scanner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scan.py ${{ inputs.ignore_age && '--ignore-age' || '' }}
      - name: Commit results
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json docs/jobs.json docs/status.json docs/excluded.json nl_sponsors_extra.txt 2>/dev/null || git add seen.json docs/jobs.json docs/status.json docs/excluded.json
          git diff --cached --quiet || git commit -m "scan: $(date -u +%F)"
          git push
